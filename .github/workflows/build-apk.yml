name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.3.5
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.5"
          include-templates: true
          cache: true

      - name: Verify Godot
        run: godot --version

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/terraria_polish.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terraria-polish-apk
          path: build/terraria_polish.apk
          retention-days: 7